<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRPS</title>
</head>
<body>
    <button onclick="
            gameResult('Rock')">
        ROCK
    </button>
    <button onclick="
            gameResult('Paper')">
        PAPER
    </button>
    <button onclick="
            gameResult('Scissor')">
        SCISSOR
    </button>
    <button onclick="
            nums.Lost = 0
            nums.Won = 0
            nums.Tie = 0;
            alert('The score has been reset!')">
        RESET SCORE
    </button>
    
</body>
<script>
    let nums = {
            Won : 0,
            Lost : 0,
            Tie : 0
        }

    function computerMove() {
        const value = Math.random()
        cMove = ''

        if (value >= 0 && value < 1/3) {
            cMove = 'Rock'
        } else if (value >= 1/3 && value < 2/3) {
            cMove = 'Paper'
        } else {
            cMove = 'Scissor'
        }

        return cMove
    }

    function gameResult(playerMove) {
        let cMove = computerMove()
        result= ''

        if (playerMove === 'Rock') {
            if (cMove === 'Rock') {
                result = 'Tie';
                nums.Tie ++;
            } else if (cMove === 'Paper') {
                result = 'Computer Won';
                nums.Lost ++;
            } else {
                result = 'You Won';
                nums.Won ++;
            }
        } else if (playerMove === 'Paper') {
            if (cMove === 'Rock') {
                result = 'You Won';
                nums.Won ++;
            } else if (cMove === 'Paper') {
                result = 'Tie';
                nums.Tie ++;
            } else {
                result = 'Computer Won';
                nums.Lost ++;
            }
        } else {
            if (cMove === 'Rock') {
                result = 'Computer Won';
                nums.Lost ++;
            } else if (cMove === 'Paper') {
                result = 'You Won';
                nums.Won ++;
            } else {
                result = 'Tie';
                nums.Tie ++;
            }
        }

        alert(`The Computer chose ${cMove} and You chose ${playerMove}, the result is ${result}!
        Won : ${nums.Won}, Lost : ${nums.Lost}, Tie : ${nums.Tie}`)
        
    }
</script>
</html>
